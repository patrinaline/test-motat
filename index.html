<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventions &amp; Innovations Hunt — prototype</title>
<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js" defer></script>

</head>
<body>

<div id="dev-fallback" style="display:none;">
  <p>No card detected. Enter a GUID manually for testing:</p>
  <input type="text" id="manual-guid-input" placeholder="e.g. test-123" />
  <button id="manual-guid-submit">Use this GUID</button>
</div>

<div id = "onboarding" class="hidden">
  <div class="card">
    <h1>Welcome!</h1>
    <p>This is a new card. Pick a username to get started.</p>
    <input type="text" id="username-input" placeholder="Enter a username" />
    <button id="username-submit">Get Started</button>
    <p class="status" id="onboarding-status"></p>
  </div>
</div>

<div id="welcome-back" class="hidden">
  <div class="card">
    <h1>Welcome back!</h1>
    <p id="welcome-message"></p>
    <div id="progress-list"></div>
  </div>
</div>



</body>
</html>
